<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen — Glossolalia</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 480px; margin: 0 auto; padding: 24px;
    display: flex; flex-direction: column; gap: 14px; text-align: center;
  }
  h1 { margin: 0; font-size: 22px; }
  .sub { color: #888; margin: 0; }
  select, button {
    font-size: 18px; padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box;
  }
  select { border: 1px solid #ccc; }
  button { background: #4a5fc1; color: white; border: none; font-weight: 600; cursor: pointer; }
  button.live { background: #c23b3b; }
  .status { font-size: 15px; color: #888; min-height: 20px; }
  .captions {
    text-align: left; font-size: 17px; line-height: 1.5;
    background: rgba(128,128,128,.1); border-radius: 12px; padding: 14px;
    min-height: 120px; max-height: 45vh; overflow-y: auto; white-space: pre-wrap;
  }
  .err { color: #c23b3b; font-size: 14px; min-height: 18px; }
  .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #2e9e5b;
    animation: pulse 1.2s infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
</style>
</head>
<body>
  <h1 id="title">Live translation</h1>
  <p class="sub" id="sessionInfo"></p>
  <select id="lang"><option value="">Choose your language…</option></select>
  <button id="toggle" disabled>Tap to listen</button>
  <div class="status" id="status"></div>
  <div class="captions" id="captions">Captions will appear here.</div>
  <div class="err" id="err"></div>

<script>
const sessionId = location.pathname.split('/').pop();
const langSel = document.getElementById('lang');
const toggleBtn = document.getElementById('toggle');
const statusEl = document.getElementById('status');
const captionsEl = document.getElementById('captions');
const errEl = document.getElementById('err');

const LANG_KEY = 'glossolalia.lang';

async function init() {
  const [sessRes, langRes] = await Promise.all([
    fetch(`/api/sessions/${sessionId}`),
    fetch('/api/languages'),
  ]);
  if (!sessRes.ok) {
    errEl.textContent = 'This session has ended or the link is wrong. Ask for a new QR code.';
    return;
  }
  const sess = await sessRes.json();
  document.getElementById('title').textContent = sess.title;
  document.getElementById('sessionInfo').textContent = `Session ${sess.sessionId}`;

  const { languages } = await langRes.json();
  for (const l of languages) {
    const opt = document.createElement('option');
    opt.value = l.code;
    opt.textContent = l.native === l.name ? l.name : `${l.native} (${l.name})`;
    langSel.appendChild(opt);
  }
  const saved = localStorage.getItem(LANG_KEY);
  if (saved && [...langSel.options].some(o => o.value === saved)) langSel.value = saved;
  toggleBtn.disabled = !langSel.value;
}
langSel.onchange = () => { toggleBtn.disabled = !langSel.value; };

let ws = null, audioCtx = null, nextPlayTime = 0, listening = false, captionsStarted = false;

function base64ToInt16(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Int16Array(bytes.buffer, 0, Math.floor(bytes.length / 2));
}

function playChunk(int16) {
  if (!audioCtx) return;
  const f32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 32768;
  const buf = audioCtx.createBuffer(1, f32.length, 24000);
  buf.copyToChannel(f32, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  const t = Math.max(audioCtx.currentTime + 0.06, nextPlayTime);
  src.start(t);
  nextPlayTime = t + buf.duration;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/listener/${sessionId}?lang=${encodeURIComponent(langSel.value)}`);
  ws.onopen = () => { errEl.textContent = ''; statusEl.innerHTML = '<span class="pulse"></span>Listening'; };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'audio') {
      playChunk(base64ToInt16(msg.data));
    } else if (msg.type === 'transcript' && msg.kind === 'output') {
      if (!captionsStarted) { captionsEl.textContent = ''; captionsStarted = true; }
      captionsEl.textContent += msg.text;
      captionsEl.scrollTop = captionsEl.scrollHeight;
    } else if (msg.type === 'status') {
      if (msg.state === 'speaker-offline') statusEl.textContent = 'Speaker reconnecting…';
      if (msg.state === 'speaker-online') statusEl.innerHTML = '<span class="pulse"></span>Listening';
      if (msg.state === 'ended') { statusEl.textContent = 'The session has ended.'; stop(false); }
    } else if (msg.type === 'error') {
      errEl.textContent = msg.message;
    }
  };
  ws.onclose = () => {
    if (listening) {
      statusEl.textContent = 'Reconnecting…';
      setTimeout(() => { if (listening) connect(); }, 1500);
    }
  };
}

function start() {
  // AudioContext must be created in the tap handler for iOS Safari to allow playback.
  audioCtx = new AudioContext();
  audioCtx.resume();
  nextPlayTime = 0;
  localStorage.setItem(LANG_KEY, langSel.value);
  listening = true;
  langSel.disabled = true;
  toggleBtn.textContent = 'Stop listening';
  toggleBtn.classList.add('live');
  connect();
}

function stop(closeWs = true) {
  listening = false;
  if (closeWs && ws) ws.close();
  if (audioCtx) audioCtx.close();
  ws = audioCtx = null;
  langSel.disabled = false;
  toggleBtn.textContent = 'Tap to listen';
  toggleBtn.classList.remove('live');
  if (statusEl.textContent !== 'The session has ended.') statusEl.textContent = '';
}

toggleBtn.onclick = () => (listening ? stop() : start());
init();
</script>
</body>
</html>
