<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glotta — Live Translation</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <div class="spacer"></div>

    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><linearGradient id="g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
          <stop stop-color="#9b86ff"/><stop offset=".55" stop-color="#56c8f5"/><stop offset="1" stop-color="#54e3c6"/></linearGradient></defs>
        <rect x="7" y="8" width="50" height="37" rx="13" fill="url(#g)"/>
        <path d="M20 41 L15 55 L31 43 Z" fill="url(#g)"/>
        <g fill="#fff">
          <rect x="15.75" y="21" width="4.5" height="10" rx="2.25"/>
          <rect x="22.75" y="17" width="4.5" height="18" rx="2.25"/>
          <rect x="29.75" y="14" width="4.5" height="24" rx="2.25"/>
          <rect x="36.75" y="17" width="4.5" height="18" rx="2.25"/>
          <rect x="43.75" y="21" width="4.5" height="10" rx="2.25"/>
        </g>
      </svg>
      <h1 class="brand-name">Glotta</h1>
      <p class="brand-tag">Real-time sermon translation</p>
    </div>

    <div class="card">
      <label class="field-label" for="title">Session name</label>
      <input id="title" class="input" placeholder="Sunday Service" autocomplete="off">
      <button id="start" class="btn btn-primary" style="margin-top:18px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>
        Start a session
      </button>
      <p class="hint" style="margin:16px auto 2px">You are the speaker. Listeners join by scanning a QR code on the next screen — no app to install.</p>
    </div>

    <div class="err" id="err"></div>
    <div class="spacer"></div>
    <p class="footer-note">Powered by Gemini Live Translate · 70+ languages</p>
  </div>

<script>
const startBtn = document.getElementById('start');
const errEl = document.getElementById('err');
startBtn.onclick = async () => {
  const title = document.getElementById('title').value.trim();
  startBtn.disabled = true;
  errEl.textContent = '';
  try {
    const res = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title }),
    });
    if (!res.ok) throw new Error('Server error ' + res.status);
    const data = await res.json();
    location.href = '/speak/' + data.sessionId;
  } catch (e) {
    errEl.textContent = 'Could not start a session. Please try again.';
    startBtn.disabled = false;
  }
};
document.getElementById('title').addEventListener('keydown', (e) => { if (e.key === 'Enter') startBtn.click(); });
</script>
</body>
</html>
