<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glossolalia — Live Translation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <div class="spacer"></div>

    <div class="brand">
      <svg class="flame" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="fl" x1="32" y1="3" x2="32" y2="61" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffe9a8"/><stop offset=".5" stop-color="#ffb24a"/><stop offset="1" stop-color="#ff5b6e"/>
          </linearGradient>
        </defs>
        <path d="M33 3c3 12 16 16 16 33a17 17 0 1 1-34 0c0-8 4-11 7-14-1 5 2 8 4 8-3-9 4-14 0-21 4 3 9 6 9 13 3-3 4-8-2-19z" fill="url(#fl)"/>
        <path d="M33 31c2 6 7 7 7 13a7 7 0 1 1-14 0c0-4 2-5 4-7 0 3 1 4 2 4-1-4 2-6 1-9 1 2 4 3 4 6z" fill="#fff" fill-opacity=".5"/>
      </svg>
      <h1 class="brand-name">Glossolalia</h1>
      <p class="brand-tag">Real-time sermon translation</p>
    </div>

    <div class="card">
      <label class="field-label" for="title">Session name</label>
      <input id="title" class="input" placeholder="Sunday Service" autocomplete="off">
      <button id="start" class="btn btn-primary" style="margin-top:18px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>
        Start a session
      </button>
      <p class="hint" style="margin:16px auto 2px">You are the speaker. Listeners join by scanning a QR code on the next screen — no app to install.</p>
    </div>

    <div class="err" id="err"></div>
    <div class="spacer"></div>
    <p class="footer-note">Powered by Gemini Live Translate · 70+ languages</p>
  </div>

<script>
const startBtn = document.getElementById('start');
const errEl = document.getElementById('err');
startBtn.onclick = async () => {
  const title = document.getElementById('title').value.trim();
  startBtn.disabled = true;
  errEl.textContent = '';
  try {
    const res = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title }),
    });
    if (!res.ok) throw new Error('Server error ' + res.status);
    const data = await res.json();
    location.href = '/speak/' + data.sessionId;
  } catch (e) {
    errEl.textContent = 'Could not start a session. Please try again.';
    startBtn.disabled = false;
  }
};
document.getElementById('title').addEventListener('keydown', (e) => { if (e.key === 'Enter') startBtn.click(); });
</script>
</body>
</html>
