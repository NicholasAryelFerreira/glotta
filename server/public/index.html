<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glotta — Live Translation</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <div class="spacer"></div>

    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><linearGradient id="g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
          <stop stop-color="#9b86ff"/><stop offset=".55" stop-color="#56c8f5"/><stop offset="1" stop-color="#54e3c6"/></linearGradient></defs>
        <rect x="7" y="8" width="50" height="37" rx="13" fill="url(#g)"/>
        <path d="M20 41 L15 55 L31 43 Z" fill="url(#g)"/>
        <g fill="#fff">
          <rect x="15.75" y="21" width="4.5" height="10" rx="2.25"/>
          <rect x="22.75" y="17" width="4.5" height="18" rx="2.25"/>
          <rect x="29.75" y="14" width="4.5" height="24" rx="2.25"/>
          <rect x="36.75" y="17" width="4.5" height="18" rx="2.25"/>
          <rect x="43.75" y="21" width="4.5" height="10" rx="2.25"/>
        </g>
      </svg>
      <h1 class="brand-name">Glotta</h1>
      <p class="brand-tag">Real-time sermon translation</p>
    </div>

    <div class="card">
      <label class="field-label" for="title">Session name</label>
      <input id="title" class="input" placeholder="Sunday Service" autocomplete="off">
      <label class="field-label" for="pwd" style="margin-top:14px">Password</label>
      <input id="pwd" class="input" type="password" placeholder="Enter password" autocomplete="off">
      <div class="err password-error" id="err" role="alert" aria-live="polite"></div>
      <button id="start" class="btn btn-primary session-action-btn" style="margin-top:14px">
        <span class="session-action-content">
          <span class="session-action-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg></span>
          <span class="session-action-label">Start a New Session</span>
        </span>
      </button>
      <button id="weekly" class="btn btn-accent session-action-btn" style="margin-top:10px" disabled>
        <span class="session-action-content">
          <span class="session-action-icon praying-hands-icon" aria-hidden="true">🙏</span>
          <span class="session-action-label" id="weeklyLabel">Main Sunday Sermon</span>
        </span>
      </button>
      <fieldset class="tier-picker">
        <legend>Session type</legend>
        <div class="tier-toggle">
          <input type="radio" name="apiTier" id="tierFree" value="free" checked>
          <label for="tierFree">Free</label>
          <input type="radio" name="apiTier" id="tierPaid" value="paid">
          <label for="tierPaid">Paid</label>
        </div>
        <p class="tier-note" id="tierNote" aria-live="polite"></p>
      </fieldset>
      <p class="hint" style="margin:16px auto 2px">You are the speaker. Listeners join by scanning a QR code on the next screen — no app to install.
        The weekly session always uses the same code, link and QR — safe to print and reuse every Sunday.</p>
    </div>

    <p class="footer-note">70+ languages</p>
    <div class="spacer"></div>
  </div>

<script>
const startBtn = document.getElementById('start');
const weeklyBtn = document.getElementById('weekly');
const errEl = document.getElementById('err');
const pwdEl = document.getElementById('pwd');
const tierInputs = [...document.querySelectorAll('input[name="apiTier"]')];
const tierNote = document.getElementById('tierNote');
const PWD_KEY = 'glotta.pwd';
const TIER_NOTES = {
  free: 'Data transmitted will be used to improve Google products. Use this option only with content that is not confidential.',
  paid: 'Please use this option with discretion because it charges the app administrator. It is appropriate for sensitive or confidential content, and the data is not stored.',
};

function selectedApiTier() {
  return tierInputs.find((input) => input.checked)?.value === 'paid' ? 'paid' : 'free';
}

function updateTierNote() {
  tierNote.textContent = TIER_NOTES[selectedApiTier()];
}

tierInputs.forEach((input) => input.addEventListener('change', updateTierNote));
updateTierNote();

// Remember the passcode on this device so the church only types it once.
pwdEl.value = localStorage.getItem(PWD_KEY) || '';

// The weekly session reuses a fixed server-configured code, so the printed
// QR and join link stay valid week after week.
let weeklySessionId = null;
fetch('/api/config')
  .then((r) => r.json())
  .then((d) => {
    weeklySessionId = d.weeklySessionId;
    weeklyBtn.disabled = false;
  })
  .catch(() => { weeklyBtn.style.display = 'none'; });

// Browsers can restore this page from the back-forward cache with the exact
// disabled state it had just before navigating to the speaker page.
window.addEventListener('pageshow', () => {
  startBtn.disabled = false;
  weeklyBtn.disabled = !weeklySessionId;
  tierInputs.forEach((input) => { input.disabled = false; });
});

async function startSession(sessionId) {
  const title = document.getElementById('title').value.trim();
  const password = pwdEl.value;
  const apiTier = selectedApiTier();
  startBtn.disabled = true;
  weeklyBtn.disabled = true;
  tierInputs.forEach((input) => { input.disabled = true; });
  errEl.textContent = '';
  try {
    const res = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, password, sessionId, apiTier }),
    });
    if (res.status === 401) {
      errEl.textContent = 'Incorrect password.';
      localStorage.removeItem(PWD_KEY);
      startBtn.disabled = false;
      weeklyBtn.disabled = !weeklySessionId;
      tierInputs.forEach((input) => { input.disabled = false; });
      return;
    }
    if (!res.ok) {
      const responseBody = await res.json().catch(() => ({}));
      throw new Error(responseBody.error || 'Server error ' + res.status);
    }
    const data = await res.json();
    localStorage.setItem(PWD_KEY, password); // worked — remember it
    localStorage.setItem('glotta.title.' + data.sessionId, data.title || title);
    localStorage.setItem('glotta.apiTier.' + data.sessionId, data.apiTier || apiTier);
    location.href = '/speak/' + data.sessionId;
  } catch (e) {
    errEl.textContent = e.message || 'Could not start a session. Please try again.';
    startBtn.disabled = false;
    weeklyBtn.disabled = !weeklySessionId;
    tierInputs.forEach((input) => { input.disabled = false; });
  }
}

startBtn.onclick = () => startSession(undefined);
weeklyBtn.onclick = () => { if (weeklySessionId) startSession(weeklySessionId); };
const submitOnEnter = (e) => { if (e.key === 'Enter') startBtn.click(); };
document.getElementById('title').addEventListener('keydown', submitOnEnter);
pwdEl.addEventListener('keydown', submitOnEnter);
</script>
</body>
</html>
