<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaker — Glotta</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/styles.css">
<style>
  .mini-brand { display: flex; align-items: center; gap: 8px; align-self: center; }
  .mini-brand .logo { width: 26px; height: 26px; animation: none; }
  .mini-brand span { font-weight: 700; font-size: 15px; color: var(--muted); letter-spacing: 0.2px; }
  .session-title { font-size: 22px; font-weight: 700; text-align: center; margin: 0; }
  .qr-card { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .service-times { color: var(--ink); font-size: 15px; font-weight: 700; text-align: center; line-height: 1.35; }
  .qr-frame {
    background: #fff; border-radius: var(--r-md); padding: 14px; line-height: 0;
    box-shadow: 0 14px 40px -18px rgba(0,0,0,.8);
  }
  .qr-frame img { width: 216px; height: 216px; display: block; border-radius: 6px; }
  .audio-meter { width: 100%; display: none; flex-direction: column; gap: 7px; margin-top: -4px; }
  .audio-meter.active { display: flex; }
  .audio-meter-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 12px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 0.6px; }
  .audio-meter-state { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 600; }
  .audio-meter-track { height: 14px; width: 100%; overflow: hidden; border-radius: 999px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); box-shadow: inset 0 1px 8px rgba(0,0,0,.25); }
  .audio-meter-fill { display: block; width: 100%; height: 100%; transform: scaleX(0); transform-origin: left center;
    background: linear-gradient(90deg, #54e3c6 0%, #83e56b 55%, #ffd166 78%, #ff6b6b 100%); transition: transform 80ms linear; }
  .code-row { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .code-label { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--faint); }
  .code-value { font-size: 30px; font-weight: 800; letter-spacing: 7px; padding-left: 7px;
    background: linear-gradient(135deg,#fff,#c9bdf7); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .join-value { font-size: 15px; font-weight: 700; text-align: center; word-break: break-all; line-height: 1.35;
    background: linear-gradient(135deg,#fff,#c9bdf7); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .copy-btn { font-size: 13px; padding: 9px 14px; width: auto; }
  .copied { color: var(--good) !important; }
  .source-card { width: 100%; padding: 16px 18px; }
  .mic-hint { font-size: 12px; color: var(--faint); margin: 8px 2px 0; line-height: 1.45; }
  .stat-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .stat-big { font-size: 17px; font-weight: 700; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chip { font-size: 12px; font-weight: 600; color: var(--ink); background: rgba(139,123,240,.18);
    border: 1px solid rgba(139,123,240,.3); padding: 4px 10px; border-radius: 999px; }
  .transcript-card { width: 100%; }
  .transcript-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
    color: var(--faint); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
  .transcript-body { font-size: 15.5px; line-height: 1.6; color: var(--ink); max-height: 180px; overflow-y: auto; white-space: pre-wrap; }
  .transcript-body.placeholder { color: var(--faint); font-style: italic; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mini-brand">
      <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><linearGradient id="g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
          <stop stop-color="#9b86ff"/><stop offset=".55" stop-color="#56c8f5"/><stop offset="1" stop-color="#54e3c6"/></linearGradient></defs>
        <rect x="7" y="8" width="50" height="37" rx="13" fill="url(#g)"/>
        <path d="M20 41 L15 55 L31 43 Z" fill="url(#g)"/>
        <g fill="#fff">
          <rect x="15.75" y="21" width="4.5" height="10" rx="2.25"/>
          <rect x="22.75" y="17" width="4.5" height="18" rx="2.25"/>
          <rect x="29.75" y="14" width="4.5" height="24" rx="2.25"/>
          <rect x="36.75" y="17" width="4.5" height="18" rx="2.25"/>
          <rect x="43.75" y="21" width="4.5" height="10" rx="2.25"/>
        </g>
      </svg>
      <span>Glotta</span>
    </div>

    <h1 class="session-title" id="title">Speaker</h1>
    <div class="pill" id="statusPill"><span class="dot" id="statusDot"></span><span id="statusText">Microphone paused</span></div>

    <div class="card qr-card">
      <p class="service-times" id="serviceTimes" hidden>Sunday services: 10:45 AM and 6:00 PM</p>
      <div class="qr-frame"><img id="qr" alt="QR code to join"></div>
      <div class="code-row">
        <span class="code-label">Join link</span>
        <span class="join-value" id="joinUrl"></span>
      </div>
      <button class="btn btn-ghost copy-btn" id="copyBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span id="copyLabel">Copy join link</span>
      </button>
    </div>

    <div class="card source-card">
      <label class="field-label" for="mic">Audio source</label>
      <select id="mic" class="input"><option value="default">Default Microphone</option></select>
      <p class="mic-hint" id="micHint">Using the computer's default microphone.</p>
    </div>

    <button id="toggle" class="btn btn-accent">
      <svg id="micIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      <span id="toggleLabel">Start speaking</span>
    </button>

    <div class="audio-meter" id="audioMeter" aria-hidden="true">
      <div class="audio-meter-head"><span>Audio input</span><span class="audio-meter-state" id="audioMeterText">Waiting for audio</span></div>
      <div class="audio-meter-track"><span class="audio-meter-fill" id="audioMeterFill"></span></div>
    </div>

    <div class="err" id="err" role="alert" aria-live="polite"></div>

    <div class="stat-row">
      <span class="stat-big" id="stats">No listeners yet</span>
    </div>
    <div class="chips" id="chips"></div>

    <div class="card transcript-card">
      <div class="transcript-head">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M3 12h18M3 19h12"/></svg>
        What the model hears
      </div>
      <div class="transcript-body placeholder" id="transcript">The live transcript appears here once the model hears audio.</div>
    </div>

    <div class="spacer"></div>
    <button class="btn btn-ghost" id="endBtn" style="max-width:200px">End session</button>
  </div>

<script>
const sessionId = location.pathname.split('/').pop();
const errEl = document.getElementById('err');
const statsEl = document.getElementById('stats');
const chipsEl = document.getElementById('chips');
const transcriptEl = document.getElementById('transcript');
const toggleBtn = document.getElementById('toggle');
const toggleLabel = document.getElementById('toggleLabel');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const joinUrlEl = document.getElementById('joinUrl');
const serviceTimes = document.getElementById('serviceTimes');
const micSel = document.getElementById('mic');
const micHint = document.getElementById('micHint');
const audioMeter = document.getElementById('audioMeter');
const audioMeterFill = document.getElementById('audioMeterFill');
const audioMeterText = document.getElementById('audioMeterText');

const MIC_KEY = 'glotta.mic';
const MAX_LIVE_TRANSCRIPT_CHARS = 2000;
const AUDIO_STATS_INTERVAL_MS = 10_000;
const SPEAKER_ENCODED_BYTES_PER_SECOND = Math.ceil(16_000 * 2 * 4 / 3) + (10 * 128);
let liveEdgeMaxQueueSeconds = 0;
let speakerAudioBufferLimitBytes = Infinity;
// Labels that indicate a laptop's own/room microphone (keep noise & echo
// processing on). Anything else is treated as a clean external feed (e.g. a
// USB interface from a sound board) and sent as-is. The hint below shows the
// active mode so the choice is never a mystery.
const BUILTIN_MIC = /built.?in|internal|macbook|imac|realtek|microphone array|laptop|default/i;

const joinLink = `${location.origin}/join/${sessionId}`;
joinUrlEl.textContent = joinLink.replace(/^https?:\/\//, '');

// Show the service schedule only for the fixed Sunday session and load the
// server-controlled live-edge safety flag before microphone capture starts.
const publicConfigReady = Promise.race([
  fetch('/api/config')
    .then((r) => r.json())
    .then((config) => {
      const isWeeklySession = config.weeklySessionId === sessionId.toUpperCase();
      serviceTimes.hidden = !isWeeklySession;
      liveEdgeMaxQueueSeconds = Number(config.liveEdgeMaxQueueSeconds) || 0;
      speakerAudioBufferLimitBytes = liveEdgeMaxQueueSeconds > 0
        ? Math.ceil(SPEAKER_ENCODED_BYTES_PER_SECOND * liveEdgeMaxQueueSeconds)
        : Infinity;
    })
    .catch(() => { serviceTimes.hidden = true; }),
  new Promise((resolve) => setTimeout(resolve, 3_000)),
]);

// Stays true while this page should hold a live connection to the session.
// Set false only when the session is gone or the speaker ends it, so we never
// reconnect forever to a dead session.
let pageActive = true;

const TITLE_KEY = 'glotta.title.' + sessionId;
const API_TIER_KEY = 'glotta.apiTier.' + sessionId;

// Recreate this exact session if the server has lost it. Render's free tier
// wipes in-memory sessions on restart/spin-down; since the speaker owns the
// code in their URL, we re-register it (with the remembered create password)
// so the QR and join links keep working and listeners can rejoin.
async function reviveSession() {
  const password = localStorage.getItem('glotta.pwd') || '';
  const title = localStorage.getItem(TITLE_KEY) || '';
  const apiTier = localStorage.getItem(API_TIER_KEY) === 'paid' ? 'paid' : 'free';
  try {
    const r = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, password, title, apiTier }),
    });
    return r.ok;
  } catch { return false; }
}

function sessionEnded() {
  errEl.textContent = 'This session has ended — start a new one from the home page.';
  toggleBtn.disabled = true;
  pageActive = false;
}

async function loadSession() {
  let r = await fetch(`/api/sessions/${sessionId}`).catch(() => null);
  if (!r || !r.ok) {
    if (!(await reviveSession())) { sessionEnded(); return; }
    r = await fetch(`/api/sessions/${sessionId}`).catch(() => null);
    if (!r || !r.ok) { sessionEnded(); return; }
  }
  const d = await r.json();
  if (d && d.title) {
    document.getElementById('title').textContent = d.title;
    localStorage.setItem(TITLE_KEY, d.title); // remembered so revival can restore it
    localStorage.setItem(API_TIER_KEY, d.apiTier === 'paid' ? 'paid' : 'free');
  }
  // Load the QR only once we know the session exists, so a dead session shows
  // the message instead of a broken image.
  document.getElementById('qr').src = `/api/sessions/${sessionId}/qr.png`;
  // Connect right away so a refresh re-establishes presence and keeps the
  // session alive even before the mic is (re)started.
  connectWs();
}
loadSession();

// Keep the free-tier service from spinning down while the speaker page is open,
// which is what was wiping idle sessions.
setInterval(() => { if (pageActive) fetch(`/api/sessions/${sessionId}`).catch(() => {}); }, 4 * 60_000);

document.getElementById('copyBtn').onclick = async () => {
  const label = document.getElementById('copyLabel');
  try {
    await navigator.clipboard.writeText(joinLink);
    label.textContent = 'Copied!';
    label.classList.add('copied');
    setTimeout(() => { label.textContent = 'Copy join link'; label.classList.remove('copied'); }, 1600);
  } catch { errEl.textContent = joinLink; }
};

// --- Audio source picker -------------------------------------------------
// Whether the currently selected source should be sent as a clean feed
// (processing off) rather than treated as a room mic (processing on).
function selectedIsClean() {
  const opt = micSel.options[micSel.selectedIndex];
  return !!(opt && opt.dataset.clean === '1');
}

function updateMicHint() {
  micHint.textContent = selectedIsClean()
    ? 'Clean external feed — sent as-is (noise/echo processing off). Best for a sound board.'
    : "Room microphone — noise & echo reduction on. Best for the laptop's own mic.";
}

// (Re)build the dropdown. Device labels only appear once mic permission has
// been granted; before that we just show "Default microphone".
async function populateMics() {
  let devices = [];
  try { devices = await navigator.mediaDevices.enumerateDevices(); } catch { return; }
  const inputs = devices.filter((d) => d.kind === 'audioinput' && d.deviceId
    && d.deviceId !== 'default' && d.deviceId !== 'communications');
  const want = (micSel.value && micSel.value !== 'default') ? micSel.value : localStorage.getItem(MIC_KEY);

  micSel.innerHTML = '';
  const def = document.createElement('option');
  def.value = 'default';
  def.textContent = 'Default Microphone';
  def.dataset.clean = '0';
  micSel.appendChild(def);

  for (const d of inputs) {
    const o = document.createElement('option');
    o.value = d.deviceId;
    o.textContent = d.label || 'Microphone';
    o.dataset.clean = BUILTIN_MIC.test(d.label || '') ? '0' : '1';
    micSel.appendChild(o);
  }

  if (want && [...micSel.options].some((o) => o.value === want)) micSel.value = want;
  updateMicHint();
}

micSel.onchange = () => {
  localStorage.setItem(MIC_KEY, micSel.value);
  updateMicHint();
};

// On load, list devices. If we already have mic permission (returning visitor),
// labels show immediately. First-time visitors see real names after their first
// "Start speaking" (we repopulate once permission is granted there). We never
// prompt for the mic just to list devices.
(async () => {
  await populateMics();
  try {
    const perm = await navigator.permissions.query({ name: 'microphone' });
    if (perm.state === 'granted') await populateMics();
    perm.onchange = () => { if (perm.state === 'granted') populateMics(); };
  } catch { /* Permissions API unsupported (e.g. Safari) — labels fill after first Start */ }
})();

if (navigator.mediaDevices) navigator.mediaDevices.ondevicechange = populateMics;

function appendBoundedText(el, text, maxChars) {
  el.textContent += text;
  if (el.textContent.length > maxChars) {
    el.textContent = el.textContent.slice(-maxChars).replace(/^\S*\s?/, '');
  }
  el.scrollTop = el.scrollHeight;
}

function setStatus(state) {
  statusDot.className = 'dot' + (state === 'live' ? ' live' : '');
  statusText.textContent = state === 'live' ? 'Live — translating' : state === 'connecting' ? 'Connecting…' : 'Microphone paused';
}

let ws = null, audioCtx = null, workletNode = null, mediaStream = null;
let speakerSocketSeq = 0;
let audioSequence = 0;
let audioStatsStartedAt = Date.now();
let capturedAudioChunks = 0;
let sentAudioChunks = 0;
let droppedAudioChunks = 0;
let peakSpeakerBufferedBytes = 0;
let transcriptStarted = false;
let speakerClaimed = false;
let claimResolver = null;
let claimTimer = null;
const SPEAKER_CLAIM_TIMEOUT_MS = 10_000;

function maybeReportAudioStats(force = false) {
  const now = Date.now();
  if (!force && now - audioStatsStartedAt < AUDIO_STATS_INTERVAL_MS) return;
  if (!ws || ws.readyState !== WebSocket.OPEN || !speakerClaimed) return;
  const currentBufferedBytes = ws.bufferedAmount;
  // Telemetry must not add traffic while the audio socket itself is congested.
  if (liveEdgeMaxQueueSeconds > 0 && currentBufferedBytes > speakerAudioBufferLimitBytes) return;
  ws.send(JSON.stringify({
    type: 'audio-stats',
    intervalMs: now - audioStatsStartedAt,
    capturedChunks: capturedAudioChunks,
    sentChunks: sentAudioChunks,
    droppedChunks: droppedAudioChunks,
    peakBufferedBytes: peakSpeakerBufferedBytes,
    currentBufferedBytes,
  }));
  audioStatsStartedAt = now;
  capturedAudioChunks = 0;
  sentAudioChunks = 0;
  droppedAudioChunks = 0;
  peakSpeakerBufferedBytes = currentBufferedBytes;
}

function sendSpeakerAudio(int16) {
  if (!running || !speakerClaimed || !ws || ws.readyState !== WebSocket.OPEN) return;
  const capturedAt = Date.now();
  const sequence = ++audioSequence;
  const bufferedBytes = ws.bufferedAmount;
  capturedAudioChunks += 1;
  peakSpeakerBufferedBytes = Math.max(peakSpeakerBufferedBytes, bufferedBytes);

  if (liveEdgeMaxQueueSeconds > 0 && bufferedBytes > speakerAudioBufferLimitBytes) {
    droppedAudioChunks += 1;
    maybeReportAudioStats();
    return;
  }

  ws.send(JSON.stringify({
    type: 'audio',
    data: int16ToBase64(int16),
    capturedAt,
    sequence,
  }));
  sentAudioChunks += 1;
  maybeReportAudioStats();
}

function finishSpeakerClaim(granted, message = '') {
  speakerClaimed = granted;
  if (claimTimer) clearTimeout(claimTimer);
  claimTimer = null;
  const resolve = claimResolver;
  claimResolver = null;
  if (message) errEl.textContent = message;
  if (resolve) resolve(granted);
}

function requestSpeakerClaim() {
  if (speakerClaimed) return Promise.resolve(true);
  return new Promise((resolve) => {
    claimResolver = resolve;
    claimTimer = setTimeout(() => {
      finishSpeakerClaim(false, 'Could not reserve the audio input. Check the connection and try again.');
    }, SPEAKER_CLAIM_TIMEOUT_MS);
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'start-speaking' }));
    } else {
      connectWs();
    }
  });
}

function releaseSpeakerClaim() {
  if (speakerClaimed && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'stop-speaking' }));
  }
  speakerClaimed = false;
}


// AudioWorklet that resamples mic input to 16 kHz mono Int16 and emits ~100 ms chunks.
const workletCode = `
class PCMCapture extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / 16000;
    this.readPos = 0;
    this.buffer = [];
    this.out = new Int16Array(1600); // 100 ms at 16 kHz
    this.outPos = 0;
  }
  process(inputs) {
    const input = inputs[0];
    if (!input || input.length === 0) return true;
    // Pro audio interfaces often receive the sound board on input 2/right.
    // Use the strongest available input channel instead of assuming channel 1.
    let ch = null;
    let bestEnergy = -1;
    for (const candidate of input) {
      if (!candidate) continue;
      let energy = 0;
      for (let i = 0; i < candidate.length; i += 4) energy += candidate[i] * candidate[i];
      if (energy > bestEnergy) { bestEnergy = energy; ch = candidate; }
    }
    if (!ch) return true;
    this.buffer.push(...ch);
    // Linear-interpolation resample from the device rate down to 16 kHz.
    while (this.readPos + 1 < this.buffer.length) {
      const i = Math.floor(this.readPos);
      const frac = this.readPos - i;
      const sample = this.buffer[i] * (1 - frac) + this.buffer[i + 1] * frac;
      this.out[this.outPos++] = Math.max(-32768, Math.min(32767, Math.round(sample * 32767)));
      this.readPos += this.ratio;
      if (this.outPos === this.out.length) {
        this.port.postMessage(this.out.slice(0));
        this.outPos = 0;
      }
    }
    const consumed = Math.floor(this.readPos);
    this.buffer = this.buffer.slice(consumed);
    this.readPos -= consumed;
    return true;
  }
}
registerProcessor('pcm-capture', PCMCapture);
`;

function int16ToBase64(int16) {
  const bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  }
  return btoa(bin);
}

let audioMeterLevel = 0;
function resetAudioMeter() {
  audioMeterLevel = 0;
  audioMeterFill.style.transform = 'scaleX(0)';
  audioMeterText.textContent = 'Waiting for audio';
}

function setAudioMeterVisible(visible) {
  audioMeter.classList.toggle('active', visible);
  audioMeter.setAttribute('aria-hidden', visible ? 'false' : 'true');
  if (!visible) resetAudioMeter();
}

function updateAudioMeter(int16) {
  if (!running || !audioMeter.classList.contains('active')) return;
  let sumSquares = 0;
  let peak = 0;
  let count = 0;
  const step = Math.max(1, Math.floor(int16.length / 800));
  for (let i = 0; i < int16.length; i += step) {
    const sample = Math.abs(int16[i]);
    peak = Math.max(peak, sample);
    sumSquares += sample * sample;
    count += 1;
  }
  const rms = Math.sqrt(sumSquares / Math.max(1, count)) / 32768;
  const peakLevel = peak / 32768;
  const rawLevel = Math.min(1, Math.max(rms * 5, peakLevel * 0.85));
  audioMeterLevel = Math.max(rawLevel, audioMeterLevel * 0.72);
  const visibleLevel = audioMeterLevel < 0.01 ? 0 : audioMeterLevel;
  audioMeterFill.style.transform = `scaleX(${visibleLevel})`;
  audioMeterText.textContent = visibleLevel > 0.08 ? 'Glotta is capturing audio' : 'Low/no signal';
}

function connectWs() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const socket = new WebSocket(`${proto}://${location.host}/ws/speaker/${sessionId}`);
  const socketSeq = ++speakerSocketSeq;
  ws = socket;
  socket.onmessage = (ev) => {
    if (socket !== ws || socketSeq !== speakerSocketSeq) return;
    const msg = JSON.parse(ev.data);
    if (msg.type === 'stats') {
      statsEl.textContent = msg.total === 0 ? 'No listeners yet' : `${msg.total} listening`;
      chipsEl.innerHTML = '';
      for (const [l, n] of Object.entries(msg.listeners)) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = `${l} · ${n}`;
        chipsEl.appendChild(chip);
      }
    } else if (msg.type === 'transcript' && msg.kind === 'input') {
      if (!transcriptStarted) { transcriptEl.textContent = ''; transcriptEl.classList.remove('placeholder'); transcriptStarted = true; }
      appendBoundedText(transcriptEl, msg.text, MAX_LIVE_TRANSCRIPT_CHARS);
    } else if (msg.type === 'speaker-claim' && msg.state === 'granted') {
      const claimExpected = Boolean(claimResolver) || running || startPending;
      finishSpeakerClaim(true);
      if (!claimExpected) {
        releaseSpeakerClaim();
        return;
      }
      if (running) setStatus('live');
    } else if (msg.type === 'error') {
      if (msg.code === 'speaker-busy') {
        const busyMessage = msg.message || 'Another device is capturing audio for this session.';
        finishSpeakerClaim(false, busyMessage);
        if (running) stop(false);
        errEl.textContent = busyMessage;
        return;
      }
      errEl.textContent = msg.message;
      if (/not found/i.test(msg.message)) {
        // The server restarted and lost the session - recreate it under the
        // same code; the reconnect loop then rejoins it automatically.
        reviveSession().then((ok) => { if (!ok) sessionEnded(); });
      }
    }
  };
  socket.onclose = () => {
    if (socket !== ws || socketSeq !== speakerSocketSeq) return;
    ws = null;
    speakerClaimed = false;
    if (!pageActive) return;
    if (running) { errEl.textContent = 'Connection lost - reconnecting...'; setStatus('connecting'); }
    setTimeout(() => { if (pageActive && !ws) connectWs(); }, 1500);
  };
  socket.onopen = () => {
    if (socket !== ws || socketSeq !== speakerSocketSeq) return;
    if (!claimResolver && !running) errEl.textContent = '';
    if (claimResolver || running) socket.send(JSON.stringify({ type: 'start-speaking' }));
  };
}

let running = false, startPending = false;

async function start() {
  if (startPending) return;
  startPending = true;
  toggleBtn.disabled = true;
  errEl.textContent = '';
  setStatus('connecting');
  await publicConfigReady;
  const claimed = await requestSpeakerClaim();
  if (!claimed) {
    setStatus('paused');
    startPending = false;
    toggleBtn.disabled = false;
    return;
  }
  // A clean external feed (e.g. a sound board via USB) is sent untouched; the
  // laptop's own mic keeps echo/noise/gain processing on for the room.
  const clean = selectedIsClean();
  const audio = {
    channelCount: { ideal: 2 },
    echoCancellation: !clean,
    noiseSuppression: !clean,
    autoGainControl: !clean,
  };
  if (micSel.value && micSel.value !== 'default') audio.deviceId = { exact: micSel.value };
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio });
  } catch (e) {
    errEl.textContent = 'Microphone access denied. Note: browsers only allow the mic on https or on localhost.';
    releaseSpeakerClaim();
    setStatus('paused');
    startPending = false;
    toggleBtn.disabled = false;
    return;
  }
  // Now that permission is granted, fill in the real device names.
  populateMics();
  micSel.disabled = true;
  audioCtx = new AudioContext();
  const blobUrl = URL.createObjectURL(new Blob([workletCode], { type: 'application/javascript' }));
  await audioCtx.audioWorklet.addModule(blobUrl);
  const source = audioCtx.createMediaStreamSource(mediaStream);
  workletNode = new AudioWorkletNode(audioCtx, 'pcm-capture');
  workletNode.port.onmessage = (ev) => {
    updateAudioMeter(ev.data);
    sendSpeakerAudio(ev.data);
  };
  source.connect(workletNode);
  running = true;
  setAudioMeterVisible(true);
  toggleLabel.textContent = 'Stop speaking';
  toggleBtn.classList.remove('btn-accent');
  toggleBtn.classList.add('btn-live');
  setStatus(speakerClaimed ? 'live' : 'connecting');
  startPending = false;
  toggleBtn.disabled = false;
}

function stop(releaseClaim = true) {
  running = false;
  maybeReportAudioStats(true);
  if (releaseClaim) releaseSpeakerClaim();
  if (workletNode) workletNode.disconnect();
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  workletNode = mediaStream = audioCtx = null;
  micSel.disabled = false;
  setAudioMeterVisible(false);
  // Keep the presence WebSocket open while releasing the audio-input lock.
  toggleLabel.textContent = 'Start speaking';
  toggleBtn.classList.remove('btn-live');
  toggleBtn.classList.add('btn-accent');
  setStatus('paused');
}

toggleBtn.onclick = () => (running ? stop() : start());

document.getElementById('endBtn').onclick = () => {
  if (!confirm('End this session for everyone listening?')) return;
  pageActive = false; // we're leaving on purpose — don't reconnect
  speakerSocketSeq += 1;
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'end' }));
  stop();
  if (ws) { ws.close(); ws = null; }
  location.href = '/';
};
</script>
</body>
</html>
