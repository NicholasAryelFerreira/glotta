# Render Blueprint — deploys the Glossolalia relay server.
# Render reads this automatically when you create a Blueprint from the repo.
services:
  - type: web
    name: glossolalia
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Set the actual value in the Render dashboard (kept secret, not in git).
      - key: GEMINI_API_KEY
        sync: false
