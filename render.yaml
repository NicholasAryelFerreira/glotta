# Render Blueprint — deploys the Glotta relay server.
# Render reads this automatically when you create a Blueprint from the repo.
#
# The service `name` is "glotta", so the public URL is glotta.onrender.com.
# Create a new Blueprint from this repo, set the provider API keys when prompted, and
# (once it is Live) delete the old "glossolalia" service in the dashboard.
services:
  - type: web
    name: glotta
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Set the actual value in the Render dashboard (kept secret, not in git).
      - key: GEMINI_API_KEY_FREE
        sync: false
      - key: GEMINI_API_KEY_PAID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Optional live model overrides; unset keeps the defaults in the code.
      - key: GEMINI_TRANSLATE_MODEL
        sync: false
      - key: GEMINI_TRANSCRIBE_MODEL
        sync: false
      - key: OPENAI_TRANSLATE_MODEL
        sync: false
      - key: OPENAI_TRANSCRIBE_MODEL
        sync: false
      # Sermon transcript email. Off unless BREVO_API_KEY, SERMON_EMAIL_TO,
      # SERMON_EMAIL_FROM and SERMON_WINDOWS are set; values live in the dashboard.
      - key: BREVO_API_KEY
        sync: false
      - key: SERMON_EMAIL_TO
        sync: false
      - key: SERMON_EMAIL_COPY_TO
        sync: false
      - key: SERMON_EMAIL_FROM
        sync: false
      - key: SERMON_EMAIL_FROM_NAME
        sync: false
      - key: SERMON_TIMEZONE
        sync: false
      - key: SERMON_WINDOWS
        sync: false
      - key: SERMON_EMAIL_MODEL
        sync: false
      - key: SERMON_EMAIL_FALLBACK_MODEL
        sync: false
      - key: SERMON_TRANSCRIBE_MODEL
        sync: false
      - key: SERMON_TRIM_PROMPT
        sync: false
      - key: SERMON_PROOFREAD_PROMPT
        sync: false
      - key: SERMON_PROOFREAD
        sync: false
