# Render Blueprint — deploys the Glotta relay server.
# Render reads this automatically when you create a Blueprint from the repo.
#
# NOTE: the service `name` below is kept as "glossolalia" on purpose — it is the
# identity of the already-deployed Render service and its public URL
# (glossolalia.onrender.com). Renaming it here would make Render create a NEW
# service and you'd have to re-enter GEMINI_API_KEY. To rebrand the URL to
# glotta.onrender.com, create a fresh Blueprint with name: glotta and delete the
# old service.
services:
  - type: web
    name: glossolalia
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Set the actual value in the Render dashboard (kept secret, not in git).
      - key: GEMINI_API_KEY
        sync: false
